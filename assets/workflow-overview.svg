<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Shushu Internship Resume Optimizer workflow overview</title>
  <desc id="desc">A diagram showing inputs, core pipeline stages, optional knowledge flow, and generated outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #10233f; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #3d556f; }
      .section { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #15304d; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .body { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #38516d; }
      .small { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #4d6683; }
      .card { fill: url(#panel); stroke: #c8d8ea; stroke-width: 2; rx: 18; ry: 18; }
      .stage { fill: #ffffff; stroke: #7fb3ff; stroke-width: 2.5; rx: 20; ry: 20; }
      .accent { fill: #e8f2ff; stroke: #7fb3ff; stroke-width: 2; rx: 16; ry: 16; }
      .output { fill: #f8fffb; stroke: #91c8a1; stroke-width: 2; rx: 16; ry: 16; }
      .arrow { stroke: #6b90c3; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #88a3c6; stroke-width: 1.4; stroke-dasharray: 5 6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="5.5" markerHeight="5.5" refX="4.8" refY="2.75" orient="auto">
      <path d="M0,0 L5.5,2.75 L0,5.5 z" fill="#6b90c3"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="60" y="70" class="title">Shushu Internship Resume Optimizer</text>
  <text x="60" y="100" class="subtitle">From raw internship materials to resume-facing bullets and interview-facing explanations</text>

  <rect x="50" y="145" width="250" height="470" class="card"/>
  <text x="80" y="185" class="section">Inputs</text>
  <rect x="75" y="210" width="200" height="92" class="accent"/>
  <text x="95" y="240" class="label">sources.json</text>
  <text x="95" y="265" class="body">links local project notes,</text>
  <text x="95" y="285" class="body">repos, and business docs</text>

  <rect x="75" y="325" width="200" height="92" class="accent"/>
  <text x="95" y="355" class="label">target_jd.txt</text>
  <text x="95" y="380" class="body">target role, hiring focus,</text>
  <text x="95" y="400" class="body">and selection criteria</text>

  <rect x="75" y="440" width="200" height="92" class="accent"/>
  <text x="95" y="470" class="label">business docs</text>
  <text x="95" y="495" class="body">optional workflow, domain,</text>
  <text x="95" y="515" class="body">and context references</text>

  <rect x="330" y="145" width="530" height="470" class="card"/>
  <text x="365" y="185" class="section">Core pipeline</text>

  <rect x="365" y="220" width="460" height="100" class="stage"/>
  <text x="390" y="254" class="label">1. achievement_audit</text>
  <text x="390" y="280" class="body">extract achievements, evidence, metrics,</text>
  <text x="390" y="300" class="body">missing information, and user-check flags</text>

  <rect x="365" y="345" width="460" height="100" class="stage"/>
  <text x="390" y="379" class="label">2. resume_rank</text>
  <text x="390" y="405" class="body">rank achievements against the JD and rewrite</text>
  <text x="390" y="425" class="body">them into tighter resume-facing bullets</text>

  <rect x="365" y="470" width="460" height="100" class="stage"/>
  <text x="390" y="504" class="label">3. interview_pack</text>
  <text x="390" y="530" class="body">turn ranked notes into STAR drafts, project intros,</text>
  <text x="390" y="550" class="body">follow-up Q&amp;A, and risk answers</text>

  <path d="M290 260 C320 260, 330 260, 370 260" class="arrow"/>
  <path d="M595 320 L595 345" class="arrow"/>
  <path d="M595 445 L595 470" class="arrow"/>

  <rect x="880" y="145" width="270" height="470" class="card"/>
  <text x="925" y="185" class="section">Outputs</text>

  <rect x="905" y="210" width="220" height="82" class="output"/>
  <text x="930" y="245" class="label">overview.md / html</text>
  <text x="930" y="269" class="small">audit summary, evidence map,</text>
  <text x="930" y="287" class="small">and missing-info snapshot</text>

  <rect x="905" y="305" width="220" height="82" class="output"/>
  <text x="930" y="340" class="label">resume_rank.md</text>
  <text x="930" y="364" class="small">ranking, gaps, and resume</text>
  <text x="930" y="382" class="small">bullet guidance</text>

  <rect x="905" y="400" width="220" height="92" class="output"/>
  <text x="930" y="430" class="label">resume_project_summary.md</text>
  <text x="930" y="454" class="small">compressed resume-facing</text>
  <text x="930" y="472" class="small">project description</text>

  <rect x="905" y="505" width="220" height="104" class="output"/>
  <text x="930" y="535" class="label">project_intro.md</text>
  <text x="930" y="557" class="label">interview_qa.md</text>
  <text x="930" y="581" class="small">STAR notes, follow-up answers,</text>
  <text x="930" y="599" class="small">and interview checks</text>

  <path d="M825 270 C855 270, 870 252, 905 252" class="arrow"/>
  <path d="M825 395 C855 395, 870 346, 905 346" class="arrow"/>
  <path d="M825 520 C855 520, 870 556, 905 556" class="arrow"/>

  <rect x="320" y="646" width="560" height="72" class="accent"/>
  <text x="350" y="678" class="label">Optional: doc_knowledge</text>
  <text x="350" y="702" class="body">query business docs for workflow details,</text>
  <text x="640" y="702" class="body">domain rules, and context</text>
  <path d="M250 486 C315 486, 320 682, 320 682" class="soft"/>
</svg>
